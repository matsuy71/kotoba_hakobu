# 学習の設定（講義第5回 pai_training の configs/train_config.yaml を参考にした）
dataset_root: "/workspace/il_data/lerobot_dataset/crane_plus_grasp"
repo_id: "crane_plus_grasp"
output_directory: "/workspace/il_data/checkpoints/crane_plus_grasp_act"
config_path: "/workspace/il/configs/grasp_features.py"

device: "cpu"
num_threads: 8           # CPU のスレッドの数。16 だと1回9.8秒、8 だと0.34秒だった（il/check_speed.py で測定）
training_steps: 10000    # 約57分。8コマずつで、手本の全体を約5.5回くり返す
log_freq: 100
num_workers: 0           # データを読む手伝い役を使わない（取り出しは1コマ0.01秒で十分速い）
batch_size: 8
chunk_size: 16
n_action_steps: 1
learning_rate: 0.0001
delta_timestamps:
  observation.environment_state: [0.0]
  observation.state: [0.0]
  action: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75]
# 画像つき ACT の学習の設定（Colab の GPU で使う）
dataset_root: "/content/crane_plus_grasp_img"
repo_id: "crane_plus_grasp_img"
output_directory: "/content/crane_plus_grasp_act_img"
config_path: "/content/grasp_img_features.py"

device: "cuda"            # Colab の GPU
num_threads: 8            # GPU のときは、ほぼ使われない
training_steps: 20000
log_freq: 100
num_workers: 2
batch_size: 32
chunk_size: 16
n_action_steps: 1
learning_rate: 0.0001
delta_timestamps:
  observation.images.top: [0.0]
  observation.state: [0.0]
  action: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75]